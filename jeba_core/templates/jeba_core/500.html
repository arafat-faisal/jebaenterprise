{% extends 'base.html' %}

{% block title %}Something Went Wrong{% endblock %}

{% block content %}
<div style="text-align: center; padding: 100px 20px; max-width: 600px; margin: 0 auto;">
    <div style="font-size: 5rem; margin-bottom: 20px;">😵</div>
    <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 15px;">Something Went Wrong</h1>
    <p style="color: var(--text-sub); font-size: 1.1rem; margin-bottom: 40px; line-height: 1.6;">
        We're experiencing an internal server error. Our team has been notified and is working to fix it.
    </p>
    <a href="{% url 'home' %}" class="btn">Try Again Later</a>
</div>
{% endblock %}
