{% extends 'base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 40px auto; text-align: center;">
    <div style="background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.04);">
        <h1 style="margin-bottom: 15px;">Reset Password</h1>
        <p style="color: #888; margin-bottom: 30px; line-height: 1.5;">
            Enter the email address associated with your account, and we’ll email you a link to reset your password.
        </p>
        
        <form method="POST">
            {% csrf_token %}
            <div style="margin-bottom: 20px; text-align: left;">
                <label style="font-weight: 700; display: block; margin-bottom: 8px;">Email Address</label>
                {{ form.email }}
            </div>
            <button type="submit" class="btn" style="width: 100%;">Send Reset Link</button>
        </form>
    </div>
</div>
<script>
    // Ensure inputs look consistent
    document.querySelectorAll('input[type="email"]').forEach(el => {
        el.style.width = "100%";
        el.style.padding = "12px";
        el.style.border = "1px solid #eee";
        el.style.borderRadius = "8px";
        el.style.background = "#F8F9FB";
    });
</script>
{% endblock %}
