{% extends 'base.html' %}

{% block title %}Password Changed{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 60px auto; text-align: center;">
    <div style="font-size: 4rem; margin-bottom: 20px;">✅</div>
    <h1 style="margin-bottom: 15px;">All Set!</h1>
    <p style="color: #666; margin-bottom: 30px;">
        Your password has been set successfully. You can now log in with your new password.
    </p>
    <a href="{% url 'login' %}" class="btn" style="padding: 12px 30px;">Log In Now</a>
</div>
{% endblock %}
