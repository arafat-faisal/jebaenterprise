{% extends 'base.html' %}

{% block title %}Check Your Email{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 60px auto; text-align: center;">
    <div style="font-size: 4rem; margin-bottom: 20px;">📨</div>
    <h1 style="margin-bottom: 15px;">Check Your Inbox</h1>
    <p style="color: #666; line-height: 1.6; margin-bottom: 30px;">
        We have sent a password reset link to your email address. Please check your inbox (and spam folder) and click the link to verify it's you.
    </p>
    <a href="{% url 'login' %}" style="color: #3F51B5; font-weight: 700; text-decoration: none;">&larr; Back to Login</a>
</div>
{% endblock %}
