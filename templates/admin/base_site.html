{% extends "admin/base.html" %}

{% block title %}Jeba Enterprise Admin{% endblock %}

{% block branding %}
    <h1 id="site-name" style="margin: 0;">
        <a href="{% url 'admin:index' %}" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
            <img src="/media/logo.svg" alt="Logo" style="height: 35px; width: auto; filter: brightness(0) invert(1);"> 
            <span style="font-family: 'Space Grotesk', sans-serif; letter-spacing: 1px; font-weight: 700; color: white;">
                JEBA ADMIN
            </span>
        </a>
    </h1>
{% endblock %}

{% block extrastyle %}
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        /* Override Django's CSS Variables with YOUR Brand Colors */
        :root {
            --primary: #3F51B5;       /* Your Deep Indigo */
            --secondary: #303F9F;     /* Darker Indigo for header */
            --accent: #FFC107;        /* Your Amber */
            --primary-fg: #ffffff;    /* Text on Indigo */
            
            --header-bg: var(--primary);
            --header-color: var(--primary-fg);
            
            --body-bg: #F0F2F5;       /* Your Light Grey Background */
            --body-fg: #212121;       /* Your Dark Text */
            
            --link-fg: #3F51B5;       /* Links are Indigo */
            --link-hover-color: #303F9F;
            
            --breadcrumbs-bg: #ffffff;
            --breadcrumbs-fg: #616161;

            /* Fonts */
            --font-family-primary: 'Inter', sans-serif;
            --font-family-header: 'Space Grotesk', sans-serif;
        }

        /* Apply Fonts */
        body {
            font-family: var(--font-family-primary);
        }
        
        h1, h2, h3, h4, h5, h6, .caption {
            font-family: var(--font-family-header);
        }

        /* Modern Header */
        #header {
            background: var(--header-bg);
            padding: 15px 40px;
            border-bottom: 4px solid var(--accent); /* Amber accent line */
        }
        
        /* Modern Buttons */
        .button, input[type=submit], input[type=button], .submit-row input, a.button {
            background: var(--accent) !important;
            color: #212121 !important;
            border: none;
            border-radius: 5px;
            font-family: var(--font-family-header);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 10px 20px;
            transition: opacity 0.2s;
        }
        .button:hover, input[type=submit]:hover {
            opacity: 0.9;
        }
        
        /* Card-like Modules */
        .module {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid #eee;
            margin-bottom: 20px;
        }
        .module caption {
            background: #ffffff;
            color: var(--primary);
            font-size: 1.2rem;
            padding: 15px;
        }
        
        /* Form Rows */
        .form-row {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        /* Sidebar Filter */
        #changelist-filter {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        #changelist-filter h2 {
            background: var(--primary);
            color: white;
            padding: 10px;
            border-radius: 8px 8px 0 0;
        }
        
    </style>
{% endblock %}
