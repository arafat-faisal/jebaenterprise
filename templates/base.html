<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');

        :root {
            /* 1. The Palette from your Image */
            --bg-body: #F3F5F9;       /* The soft background grey */
            --bg-card: #FFFFFF;       /* Pure white cards */
            --text-main: #1A1C1E;     /* Dark, nearly black text */
            --text-sub: #8E94A3;      /* Soft grey text */
            
            --accent-lime: #D4F759;   /* That "View All Products" button color */
            --accent-black: #000000;  /* For primary buttons */
            
            /* 2. The Shapes */
            --radius-xl: 28px;        /* For the big hero card */
            --radius-lg: 20px;        /* For product cards */
            --radius-pill: 50px;      /* For buttons/search bar */
            
            /* 3. The "Soft" Depth */
            --shadow-soft: 0 10px 40px rgba(0,0,0,0.04);
            --shadow-hover: 0 15px 50px rgba(0,0,0,0.08);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif; /* Modern geometric sans */
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            /* We remove the top padding because the header will be part of the flow now */
        }

        /* --- The New Floating Header --- */
        /* --- The New Floating Header --- */
        .site-header {
            background-color: var(--bg-card);
            padding: 15px 20px; /* Reduced padding */
            border-radius: var(--radius-lg); /* Smaller radius on mobile */
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-wrap: wrap; /* Allow wrapping for mobile */
            gap: 15px;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 20px auto;
            position: relative;
        }

        .logo {
            font-weight: 800;
            font-size: 1.3rem; /* Slightly smaller */
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-right: auto; /* Pushes icons to the right */
        }

        /* The Search Bar */
        .search-container {
            flex-grow: 1;
            max-width: 500px;
            position: relative;
            /* Mobile Default: Order 3 (Bottom) */
            order: 3; 
            width: 100%; /* Full width on mobile */
            margin: 0;
        }
        
        /* Navigation */
        .nav-links {
            display: flex;
            align-items: center;
            order: 2; /* Top Right on mobile */
        }

        /* --- DESKTOP OVERRIDES (Screens wider than 768px) --- */
        @media (min-width: 768px) {
            .site-header {
                padding: 15px 30px;
                border-radius: var(--radius-pill);
                flex-wrap: nowrap; /* One single line */
            }
            .logo { font-size: 1.5rem; margin-right: 0; }
            .search-container { 
                order: 0; /* Natural flow */
                margin: 0 40px; 
                width: auto; 
            }
            .nav-links { order: 0; }
        }
        .search-input {
            width: 100%;
            padding: 12px 20px;
            border-radius: var(--radius-pill);
            border: 1px solid #eee;
            background: #F8F9FB;
            font-family: inherit;
            outline: none;
            transition: 0.2s;
        }
        .search-input:focus {
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            margin-left: 20px;
            font-size: 0.95rem;
        }
        .nav-icon {
            background: #F8F9FB;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 10px;
            transition: 0.2s;
            position: relative; /* <--- ADD THIS LINE */
        }
        .nav-icon:hover {
            background: #eee;
        }

        /* --- Global Layout --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: transparent; /* Remove old white box */
            padding: 0;
            box-shadow: none;
        }

        h1, h2, h3 { color: var(--text-main); margin-top: 0; }

        /* --- The "Lime" Button Style --- */
        .btn {
            background-color: var(--accent-lime);
            color: var(--text-main);
            font-weight: 700;
            padding: 12px 24px;
            border-radius: var(--radius-pill);
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        
        /* Footer */
        .site-footer {
            text-align: center;
            color: var(--text-sub);
            margin-top: 50px;
            padding-bottom: 20px;
        }
        .camera-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-45%);
            cursor: pointer;
            transition: 0.2s;
        }
        .camera-icon:hover svg {
            stroke: var(--text-main);
        }
    </style>

    <title>{% block title %}Jeba Enterprise{% endblock %}</title>
</head>
<body>

    <header class="site-header">
        <a href="{% url 'pricing_sheet' %}" class="logo">
            <img src="/media/logo.svg" alt="Jeba Enterprise" style="height: 40px; width: auto;">
        </a>
        
        <!-- 2. Pill Search Bar with Image Upload -->
        <form method="GET" action="{% url 'search' %}" class="search-container" id="search-form" enctype="multipart/form-data">
            <span class="search-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E94A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </span>
            
            <input type="search" name="q" placeholder="Search products..." class="search-input" value="{{ request.GET.q|default:'' }}">
            
            <!-- Camera Icon Trigger -->
            <label for="image-upload" class="camera-icon" title="Search by Image">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8E94A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
            </label>
            <!-- Hidden File Input -->
            <input type="file" name="image" id="image-upload" style="display: none;" accept="image/*">
        </form>
        
        <nav class="nav-links">
            {% if user.is_authenticated %}
                <a href="{% url 'my_orders' %}" class="nav-icon" title="My Orders">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                </a>
                <a href="{% url 'view_cart' %}" class="nav-icon" title="Cart">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                    {% if request.session.cart %}<span style="position: absolute; top: 10%; right: 0%; width: 10px; height: 10px; background: var(--accent-lime); border: 2px solid #fff;border-radius: 50%;"></span>{% endif %}
                </a>
                <a href="{% url 'user_logout' %}" class="nav-icon" title="Logout">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}" class="btn" style="padding: 8px 24px; font-size: 0.9rem;">Sign Up</a>
            {% endif %}
        </nav>
    </header>

    <style>
        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-45%);
            z-index: 1;
        }
        .search-input {
            padding-left: 45px; /* Make room for the icon */
        }
    </style>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="site-footer">
        © {% now "Y" %} Jeba Enterprise. All rights reserved.
    </footer>
    <!-- Add this Javascript to base.html scripts block -->
    <script>
        document.getElementById('image-upload').addEventListener('change', function() {
            if (this.files && this.files[0]) {
                // Change form method to POST for file upload
                const form = document.getElementById('search-form');
                form.method = 'POST'; 
                // We also need to change the encoding type dynamically
                form.enctype = 'multipart/form-data';
                
                // Add CSRF token if not present (Django needs this for POST)
                if (!form.querySelector('[name=csrfmiddlewaretoken]')) {
                    const csrfInput = document.createElement('input');
                    csrfInput.type = 'hidden';
                    csrfInput.name = 'csrfmiddlewaretoken';
                    csrfInput.value = '{{ csrf_token }}';
                    form.appendChild(csrfInput);
                }
                
                form.submit();
            }
        });
    </script>
{% block scripts %}
{% endblock %}
</body>
</html>
