{% load static %}

<title>{{ seo_data.seo_title }}</title>
<meta name="title" content="{{ seo_data.seo_title }}">
<meta name="description" content="{{ seo_data.seo_description }}">

<meta property="og:type" content="website">
<meta property="og:title" content="{{ seo_data.seo_title }}">
<meta property="og:description" content="{{ seo_data.seo_description }}">
{% if seo_data.seo_image %}
<meta property="og:image" content="{{ request.build_absolute_uri }}{{ seo_data.seo_image }}">
{% endif %}

<link rel="icon" href="{% static 'images/favicon.ico' %}">

{% if site_settings %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "{{ site_settings.site_name }}",
  "url": "{{ request.build_absolute_uri }}",
  "logo": "{% if site_settings.default_social_image %}{{ request.build_absolute_uri }}{{ site_settings.default_social_image.url }}{% else %}{{ request.build_absolute_uri }}/static/media/logo.png{% endif %}",
  "contactPoint": {
    "@type": "ContactPoint",
    "contactType": "customer service"
  }
}
</script>
{% endif %}
